# NAME MUST MATCH THE DEPLOYED WORKER. It is "tmarsi", not the "forex-setup-alerts"
# this file used to say - the worker was created under a different name than the
# config assumed. Deploying under the old name would have stood up a SECOND worker
# and left the original running, so two bots would have been alerting at once, the
# old one still on the superseded strategy.
name = "tmarsi"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Two passes per 5-minute candle. ORDER MATTERS: src/index.js identifies which pass
# fired by matching event.cron against the first string here, so the early pass must
# stay first.
#   :03 etc - EARLY, 2 minutes before the bar closes, evaluates the forming bar and
#             sends a "get ready" heads-up.
#   :00 etc - CLOSE, evaluates the bar that just closed, but only for pairs the early
#             pass flagged, so it costs API calls only when something actually formed.
[triggers]
crons = [
  "3,8,13,18,23,28,33,38,43,48,53,58 * * * *",
  "0,5,10,15,20,25,30,35,40,45,50,55 * * * *",
]

# The live namespace this worker already uses. A KV namespace id is an identifier,
# not a credential - it is useless without account auth, which is why Cloudflare's own
# workflow has it committed here. The SECRETS (bot token, chat id, API keys) are set
# separately via the dashboard or `wrangler secret put` and never appear in this file.
#
# This is load-bearing, not optional: KV dedupes alerts per bar, enforces one signal
# per day, carries the pending list from the early pass to the close pass, and counts
# the daily API quota. Deploying with a wrong or placeholder id breaks all four.
[[kv_namespaces]]
binding = "ALERT_STATE"
id = "68f5be9ec3a54af2b7bbcbde75d7a9f1"

# SECRETS STORE BINDINGS - and why they have to be declared here.
#
# There are two kinds of secret on a Worker and they behave differently under a
# deploy. Plain Worker secrets (`wrangler secret put`) live on the worker itself,
# are not in this file, and survive a deploy untouched. SECRETS STORE bindings are
# account-level entries that the worker is *linked* to, and that link is config -
# it lives here. A deploy applies this file wholesale, so a deploy from a config
# that does not declare them REMOVES the links.
#
# That is exactly what happened on the first Git deploy: all four bindings vanished
# and every request came back Unauthorized, because env.WEBHOOK_SECRET was suddenly
# undefined. The values were never lost - they are account-level and were sitting in
# the store the whole time - but the worker could no longer see them.
#
# store_id and secret_name are identifiers, not values. The secrets themselves stay
# in Cloudflare and never appear in this repo.
[[secrets_store_secrets]]
binding = "TELEGRAM_BOT_TOKEN"
store_id = "7b939d7f084e45d1bfd60d73858ad1bd"
secret_name = "TELEGRAM_BOT_TOKEN"

[[secrets_store_secrets]]
binding = "TELEGRAM_CHAT_ID"
store_id = "7b939d7f084e45d1bfd60d73858ad1bd"
secret_name = "TELEGRAM_CHAT_ID"

[[secrets_store_secrets]]
binding = "TWELVEDATA_API_KEY"
store_id = "7b939d7f084e45d1bfd60d73858ad1bd"
secret_name = "TWELVEDATA_API_KEY"

[[secrets_store_secrets]]
binding = "WEBHOOK_SECRET"
store_id = "7b939d7f084e45d1bfd60d73858ad1bd"
secret_name = "WEBHOOK_SECRET"
